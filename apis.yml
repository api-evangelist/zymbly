aid: zymbly
name: Zymbly
description: >-
  Zymbly is a Y Combinator (Winter 2026) startup building a voice-first AI copilot
  for aircraft maintenance. Its AI agents automate the administrative half of a
  maintenance technician's day at airlines and MROs (maintenance, repair, and
  overhaul organizations): troubleshooting issues, looking up parts, retrieving
  technical documentation, and generating compliant paperwork so technicians can
  focus on the aircraft. Zymbly is a demo-led B2B product with no public API,
  developer portal, SDKs, or machine-readable specifications at this time; this
  profile was added to the API Evangelist network as a portfolio-lead stub and
  enriched from the company's public marketing site.
